# 冷冻样本库夜班交接 —— 默认（生产形态）本地编排
# 前端宿主机端口由 WEB_PORT 覆盖：WEB_PORT=8080 docker compose up --build
#
# 注意：默认配置【不挂载】任何验收/重置接口（SAMPLE_ENABLE_TEST_RESET 默认 false），
# 任何能访问页面的人都无法清空交接与保管记录。需要跑一次性验收时，
# 额外叠加 docker-compose.verify.yml（见 README）。
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sample_db
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sample -d sample_db"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      SAMPLE_DATABASE_URL: postgresql+psycopg://sample:sample@db:5432/sample_db
      SAMPLE_HANDOFF_TTL_SECONDS: "600"
      # 验收钩子默认关闭；请不要在面向真实数据的环境开启
      SAMPLE_ENABLE_TEST_RESET: "false"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      # 宿主机端口可用 WEB_PORT 覆盖，默认 8080
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
